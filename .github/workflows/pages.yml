name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/webpage-github-vercel-supabase-bhdskz
    # 아래 '생성물' 경로만 바뀐 커밋은 재실행하지 않는다(루프 방지).
    paths-ignore:
      - ".nojekyll"
      - "index.html"
      - "index.txt"
      - "404.html"
      - "404/**"
      - "_next/**"
      - "dashboard/**"
      - "docs/**"
  workflow_dispatch:

# 현재 Pages 소스 폴더 설정이 '/ (root)' 이든 '/docs' 이든 모두 동작하도록,
# 빌드 결과(out/)를 브랜치 루트와 docs/ 양쪽에 .nojekyll 과 함께 올린다.
# .nojekyll 이 있어야 Jekyll 이 '_next'(언더스코어 폴더)를 지우지 않는다.
permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci || npm install
      - name: Build static export
        run: npm run build
      - name: Publish static export (branch root + /docs)
        run: |
          set -e
          # /docs 미러
          rm -rf docs
          cp -a out docs
          touch docs/.nojekyll
          # 브랜치 루트에도 배치 (소스 파일과 이름이 겹치지 않음)
          cp -a out/. ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html index.txt 404.html 404 _next dashboard docs
          if git diff --cached --quiet; then
            echo "no site changes"
          else
            git commit -m "chore(pages): publish static site (root + /docs)"
            git push origin HEAD:refs/heads/claude/webpage-github-vercel-supabase-bhdskz
          fi
