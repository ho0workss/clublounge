name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/webpage-github-vercel-supabase-bhdskz
    # '생성물' 경로만 바뀐 커밋은 재실행하지 않는다(루프 방지).
    paths-ignore:
      - ".nojekyll"
      - "_config.yml"
      - "index.html"
      - "index.txt"
      - "404.html"
      - "404/**"
      - "_next/**"
      - "dashboard/**"
      - "docs/**"
  workflow_dispatch:

# GitHub Pages 의 브랜치 빌드는 Jekyll 을 무조건 실행하며 .nojekyll 을 무시한다.
# Jekyll 은 언더스코어(_) 폴더를 기본 제외하므로 Next.js 의 '_next'(앱 JS/CSS)가 사라진다.
# 해결: _config.yml 에 include: ["_next"] 를 넣어 Jekyll 이 _next 를 보존하게 한다.
# 소스 폴더가 '/ (root)' 이든 '/docs' 이든 동작하도록 루트와 docs/ 양쪽에 발행한다.
permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci || npm install
      - name: Build static export
        run: npm run build
      - name: Publish static export (branch root + /docs)
        run: |
          set -e
          # Jekyll 이 _next 를 보존하도록 설정
          printf 'include: ["_next"]\n' > out/_config.yml
          # /docs 미러
          rm -rf docs
          cp -a out docs
          touch docs/.nojekyll
          # 브랜치 루트에도 배치
          cp -a out/. ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll _config.yml index.html index.txt 404.html 404 _next dashboard docs
          if git diff --cached --quiet; then
            echo "no site changes"
          else
            git commit -m "chore(pages): publish static site (root + /docs)"
            git push origin HEAD:refs/heads/claude/webpage-github-vercel-supabase-bhdskz
          fi
