name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/webpage-github-vercel-supabase-bhdskz
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

# 현재 Pages 소스가 '이 브랜치 + /docs' 로 설정돼 있으므로, 빌드 결과를
# 이 브랜치의 docs/ 폴더에 커밋한다. paths-ignore(docs/**) 로 재실행 루프를 막고,
# contents:write 로 푸시한다. (Pages 시스템의 pages-build-deployment 는
# 이 푸시에 대해 별도로 실행되어 사이트를 발행한다.)
permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci || npm install
      - name: Build static export
        run: npm run build
      - name: Publish static export into /docs
        run: |
          rm -rf docs
          cp -a out docs
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no docs changes"
          else
            git commit -m "chore(pages): publish static site to /docs"
            git push origin HEAD:refs/heads/claude/webpage-github-vercel-supabase-bhdskz
          fi
