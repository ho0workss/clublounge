name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/webpage-github-vercel-supabase-bhdskz
  workflow_dispatch:

# gh-pages 브랜치에 빌드 결과를 푸시한다. contents:write 만 있으면 되므로
# Pages API(사이트 생성) 권한이 없어도 동작한다.
permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci || npm install
      - name: Build static export
        run: npm run build
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
